name: CI

# Pull requests run this directly; pushes to master run it through the Publish workflow,
# which calls it before deciding whether there is a version to publish.
on:
    pull_request:
    workflow_call:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

# nothing here writes to the repository or publishes, so the token should not be able to
permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install
              run: npm ci

            - name: Lint
              run: npm run lint

            - name: Format
              run: npm run format:check

            - name: Types
              run: npm run typecheck

            # the version in package.json cannot ship without its release notes
            - name: Changelog section
              run: node scripts/changelog-section.mjs > /dev/null

            # before the tests: the node suite imports the built package
            - name: Build
              run: npm run build

            - name: Tests
              run: npx vitest run

            # packs the tarball and checks it from outside, the way a consumer meets it
            - name: Verify the published surface
              run: npm run verify:types
